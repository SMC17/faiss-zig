# Same gate as CI (qsr path dep). Prefer primary CI once CROSS_REPO_PAT is set.
name: Hygiene Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zig-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qsr-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/qsr-zig
          path: deps/qsr-zig
          fetch-depth: 1
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: zig fmt --check
        run: zig fmt --check src build.zig
      - name: zig build test
        run: zig build test --summary all
