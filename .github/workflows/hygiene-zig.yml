name: Hygiene Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zig-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: zig fmt --check
        run: zig fmt --check src build.zig
      - name: zig build test
        run: zig build test --summary all
