# Hygiene gate for faiss-zig.
# Default `zig build` installs examples that path-depend on qsr-zig (not always
# present in a clean clone). Gate on fmt + unit tests only until qsr is wired
# like vllm deps/ multi-checkout.
name: Hygiene Zig

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  zig-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: zig version
        run: zig version
      - name: zig fmt --check
        run: zig fmt --check src build.zig
      - name: zig build test
        run: zig build test --summary all
