# Clean-clone CI: private qsr-zig checked out into deps/.
# Set repository secret CROSS_REPO_PAT with contents:read on SMC17/qsr-zig
# (default GITHUB_TOKEN cannot read other private repos).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout qsr-zig into deps/
        uses: actions/checkout@v4
        with:
          repository: SMC17/qsr-zig
          path: deps/qsr-zig
          fetch-depth: 1
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: zig build test
        run: zig build test --summary all
